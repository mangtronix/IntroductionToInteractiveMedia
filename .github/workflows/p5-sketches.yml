# Checks that the p5 ↔ Arduino Serial sketches work, on the p5.js version
# they ask for and on the newest p5.js. This runs the check when a
# file in the folder changes, and when you press "Run workflow" on the
# Actions page (do that before teaching from the sketches). When it fails,
# GitHub emails the repository owner, and the log shows which sketch broke
# and on which p5.js version.
#
# It does not run on a schedule. To run it every week as well, add this
# under "on:" below:
#
#   schedule:
#     - cron: "0 6 * * 1" # every Monday, 06:00 UTC

name: p5 sketches

on:
  workflow_dispatch: # "Run workflow" button on the Actions page
  push:
    paths:
      - "code/p5ArduinoSerial/**"
      - ".github/workflows/p5-sketches.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run each sketch
        run: node code/p5ArduinoSerial/check_sketches.mjs
