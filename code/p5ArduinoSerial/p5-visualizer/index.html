<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/addons/p5.sound.min.js"></script>
    <!-- p5.webserial library by gohai: https://github.com/gohai/p5.webserial -->
    <script src="https://unpkg.com/@gohai/p5.webserial@^1/libraries/p5.webserial.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
    </main>
    <!-- These blocks are shown at the bottom of the page
         (sketch.js moves them below its own controls) -->
    <div id="showControl">
      <label for="showInput">Show input:</label>
      <select id="showInput">
        <option value="POT" selected>Potentiometer</option>
        <option value="B">Buttons</option>
      </select>
    </div>
    <div id="outputControl">
      <label for="showOutput">Show output:</label>
      <select id="showOutput">
        <option value="LED" selected>LED</option>
        <option value="SERVO">Servo</option>
      </select>
    </div>
    <div id="potSendControl">
      <label for="potSend">When to send:</label>
      <select id="potSend">
        <option value="LOOP">Loop</option>
        <option value="CHANGE" selected>On Change</option>
      </select>
    </div>

      <a href="../SerialExplainer.ino" target="_blank">Arduino code</a>

      <p>

        <a href="../p5-1-read-pot/">1. Read the pot</a>

        <a href="../p5-3-both-directions/">3. Both directions</a>
        <a href="../p5-4-button/">4. Buttons</a>
        <a href="../p5-5-servo/">5. Servo</a>
      </p>
    </footer>
    <script src="sketch.js"></script>
  </body>
</html>
