<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.2/dist/p5.sound.min.js"></script>
    <!-- p5.webserial library by gohai: https://github.com/gohai/p5.webserial -->
    <script src="https://unpkg.com/@gohai/p5.webserial@^1/libraries/p5.webserial.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
    </main>
    <!-- The controls under the canvas. The canvas itself is put in <main>
         by p5, and sketch.js adds its buttons and slider to "mainRow". -->
    <div id="controls">
      <div class="row" id="mainRow"></div>
      <div class="row">
        <label>Show input:
          <select id="showInput">
            <option value="POT" selected>Potentiometer</option>
            <option value="B">Buttons</option>
          </select>
        </label>
        <label>Show output:
          <select id="showOutput">
            <option value="LED" selected>LED</option>
            <option value="SERVO">Servo</option>
          </select>
        </label>
        <label>When to send:
          <select id="potSend">
            <option value="LOOP">Loop</option>
            <option value="CHANGE" selected>On Change</option>
          </select>
        </label>
      </div>
      <div class="row links">
        <a href="https://github.com/mangtronix/IntroductionToInteractiveMedia/blob/master/code/p5ArduinoSerial/p5ArduinoSerial.ino" target="_blank">Arduino code</a>
        <a href="https://github.com/mangtronix/IntroductionToInteractiveMedia/blob/master/code/p5ArduinoSerial/p5-visualizer/sketch.js" target="_blank">p5 sketch</a>
        <a href="https://github.com/mangtronix/IntroductionToInteractiveMedia/blob/master/code/p5ArduinoSerial/p5ArduinoSerial_schematic.png" target="_blank">Schematic</a>
        <a href="https://github.com/mangtronix/IntroductionToInteractiveMedia/blob/master/code/p5ArduinoSerial/p5ArduinoSerial_breadboard_half.png" target="_blank">Breadboard</a>
      </div>
      <div class="row links">
        <span>Step-by-step sketches:</span>
        <a href="https://editor.p5js.org/mangtronix/sketches/BK4nCyyIk" target="_blank">1. Read the pot</a>
        <a href="https://editor.p5js.org/mangtronix/sketches/2F9qXmmkm" target="_blank">2. Control the LED</a>
        <a href="https://editor.p5js.org/mangtronix/sketches/5ne2zOz-E" target="_blank">3. Both directions</a>
        <a href="https://editor.p5js.org/mangtronix/sketches/wYxJaFu3n" target="_blank">4. Buttons</a>
        <a href="https://editor.p5js.org/mangtronix/sketches/vO1mlVwjb" target="_blank">5. Servo</a>
        <a href="https://editor.p5js.org/mangtronix/sketches/I8v7OI_Z1" target="_blank">6. Game</a>
      </div>
    </div>
    <script src="sketch.js"></script>
  </body>
</html>
